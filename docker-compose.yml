version: '3.1'

services:
  # 1. Relational Source of Truth (MySQL 8.1 ของเดิม ไม่เปลี่ยนแปลงค่าใดๆ)
  db:
    image: mysql:8.1
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql-files/

  # 2. Serving Layer (PostgreSQL + pgvector สำหรับบทที่ 6.x และ Web Demo)
  pgvector_db:
    image: pgvector/pgvector:pg16
    container_name: cn230_pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cn230_lci_vector
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data: